name: mo-eval suite
description: >-
  Mine this repository's merged pull requests into an evaluation suite, validate it with the
  repository's own tests, and hand it to the mo-eval service to run coding agents against.
author: Momento
branding:
  icon: check-square
  color: green

inputs:
  service:
    description: >-
      Base URL of the mo-eval service. Defaults to the hosted service; override only to point a
      repository at a different deployment.
    default: "https://evals.gomomento.ai"
  token:
    description: >-
      Bearer token for the service. Leave unset to authenticate as this repository with a GitHub
      Actions ID token instead — the workflow then needs `permissions: id-token: write` and no secret.
    required: false
    default: ""
  arms:
    description: >-
      Model routes to evaluate the suite on, space-separated (one arm each). "none" builds and
      validates the suite without running anything.
    default: "none"
  harnesses:
    description: >-
      Coding-agent harnesses to evaluate against every model route, space-separated: mo, cc, pi, strands, codex.
    default: "mo"
  history:
    description: How many recently merged pull requests to offer as candidates
    default: "300"
  candidates:
    description: How many candidates to request source for
    default: "12"
  config:
    description: Path to the repository's mo-eval configuration, relative to the checkout
    default: ".mo-eval/config.toml"
  out:
    description: >-
      Where the generated suite is written. Defaults to a directory under the runner's temp space,
      so nothing is written into the repository's checkout.
    default: ""
  dry-run:
    description: >-
      "true" mines and selects, prints the funnel, and runs nothing — seconds instead of minutes,
      for a first look at whether a repository is a fit before any candidate is validated.
    default: "false"
  repeats:
    description: >-
      How many times to run each arm, so a comparison rests on more than one sample. The service
      caps this and REFUSES an over-cap request rather than quietly running fewer — a run recorded
      as the cap when more was asked for would be a different benchmark reported as yours.
    default: "1"
  mo-version:
    description: >-
      Published mo release to run every arm on, as `X.Y.Z`, in place of the version the service
      pins. Leave empty for the pin. The lane stages it only after checking it against the release's
      published SHA256SUMS, and the run's results name the version it ran.
    default: ""
  claude-code-version:
    description: >-
      Published Claude Code release a `cc` arm runs, as `X.Y.Z`, in place of the pinned one — for a
      model Anthropic serves only to a newer Claude Code. Leave empty for the pin. Needs `cc` among
      `harnesses`. Verified against the release manifest's checksum, and named in the run's results.
    default: ""
  codex-version:
    description: >-
      Published Codex CLI release a `codex` arm runs, as `X.Y.Z` (the `rust-v` tag without its
      prefix), in place of the pinned one. Leave empty for the pin. Needs `codex` among `harnesses`.
      A version the lane does not pin a digest for is verified against the SHA-256 GitHub publishes
      for the release asset, and refused when GitHub lists none. Named in the run's results.
    default: ""
  repo-name:
    description: >-
      The `owner/name` the suite was mined as, which is the tenant the service proved its tasks
      under. Defaults to this repository. Set it only when the repository's config declares an
      upstream with `repo = "owner/name"` — on a fork that declaration is the upstream, so the
      checkout's own name would be a different tenant, whose tasks these are not.
    default: ${{ github.repository }}
  reuse-suite:
    description: >-
      Path to a suite a previous run already mined and validated. Set it to skip mining and
      validation entirely and only run `arms` against that suite — which is the expensive half: the
      mining reads merged pull requests and the validation runs the repository's own tests once per
      candidate, while changing the model or harness changes neither. Leave empty to mine a fresh
      suite. The path must outlive the run that built it, because a runner's temp space does not —
      use a cache. NOT this Action's own artifact: that carries the task records for reading
      (`tasks/`, `wire/`, `funnel.txt`) and deliberately not the runnable bundles, so a suite
      restored from it has no `local-suite/` and is refused.
    default: ""

runs:
  using: composite
  steps:
    - name: mine and validate
      # Skipped entirely when `reuse-suite` names a suite already proved: mining reads merged pull
      # requests and validation runs the repository's own tests per candidate, and neither depends on
      # which model or harness the arms name.
      if: inputs.reuse-suite == ''
      shell: bash
      # The runner is standard-library Python: nothing to install. It runs from the action's own
      # checkout, so nothing of it lands in the repository being evaluated. The repository's own
      # toolchain must already be on PATH — set it up in the workflow before this step, the same
      # way the repository's CI does.
      run: |
        read -r -a harnesses <<< "${MO_EVAL_HARNESSES:-mo}"
        echo "MO_EVAL_OUT=${{ inputs.out || format('{0}/mo-eval', runner.temp) }}" >> "$GITHUB_ENV"
        python3 "$GITHUB_ACTION_PATH/runner/main.py" suite \
          --repo "$GITHUB_WORKSPACE" --config "${{ inputs.config }}" \
          --service "${{ inputs.service }}" \
          --history "${{ inputs.history }}" --candidates "${{ inputs.candidates }}" \
          --out "${{ inputs.out || format('{0}/mo-eval', runner.temp) }}" \
          --harnesses "${harnesses[@]}" \
          --repeats "$MO_EVAL_REPEATS" \
          --mo-version "$MO_EVAL_MO_VERSION" \
          --claude-code-version "$MO_EVAL_CLAUDE_CODE_VERSION" \
          --codex-version "$MO_EVAL_CODEX_VERSION" \
          ${{ inputs.dry-run == 'true' && '--dry-run' || '' }} \
          ${{ inputs.arms != 'none' && format('--run {0}', inputs.arms) || '' }}
      env:
        MO_EVAL_HARNESSES: ${{ inputs.harnesses }}
        # Through the environment, never `${{ … }}` inside the script: an expression is substituted
        # into the source BEFORE the shell parses it, so `$(…)` in an input runs even inside double
        # quotes. An environment value is data the shell expands, not source it re-reads.
        MO_EVAL_REPEATS: ${{ inputs.repeats }}
        MO_EVAL_MO_VERSION: ${{ inputs.mo-version }}
        MO_EVAL_CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
        MO_EVAL_CODEX_VERSION: ${{ inputs.codex-version }}
        MO_EVAL_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ github.token }}   # reads this repository's merged pull requests

    - name: run an already-proved suite
      # The other half of the split: `submit` uploads the bundles this suite already holds and
      # records the run, with no mining and no validation. Bundles are re-uploaded because a run
      # names storage keys the service resolves for itself; that is a transfer, not a re-proof, and
      # it is the cheap half. Running purely by suite id, with no transfer at all, needs the service
      # to answer which tasks a repository has already proved — a wire change, tracked separately.
      #
      # `--conventions-from` is NOT optional here. Without it the conventions judge loses the
      # sources it grades against, so a reused suite would score differently from a freshly mined
      # one for a reason nothing in the output names.
      #
      # `--repo-name` comes from the `repo-name` input, which defaults to this repository. An input
      # rather than something read back out of the suite tree: that tree arrives through a cache or
      # an artifact, and parsing a file from it to decide which TENANT to submit under would put an
      # untrusted document in charge of that choice. A declaration by the workflow cannot be steered
      # by whoever wrote the cache.
      if: inputs.reuse-suite != ''
      shell: bash
      run: |
        read -r -a harnesses <<< "${MO_EVAL_HARNESSES:-mo}"
        read -r -a arms <<< "$MO_EVAL_ARMS"
        # Refused, not escaped. `GITHUB_ENV` is a line-oriented file, so a newline in the value
        # becomes a SECOND record — `MO_EVAL_OUT=<path>\nMO_EVAL_DRY_RUN=true` sets both, which
        # would redirect the summary and the artifact. A delimiter form can be escaped by a value
        # carrying the delimiter; a suite path with a newline in it is not a path anyone meant.
        case $MO_EVAL_REUSE in
          *[$'\n\r']*)
            echo "reuse-suite: the path contains a newline, which would write extra records into GITHUB_ENV" >&2
            exit 2
            ;;
        esac
        if [ "$MO_EVAL_ARMS" = "none" ]; then
          echo "reuse-suite: set 'arms' to the model route(s) to run — reusing a suite exists to run arms against it, and 'none' asks for nothing" >&2
          exit 2
        fi
        # `dry-run` promises the Action runs nothing. This step has no mining pass to stop short of,
        # so honouring it would mean doing nothing at all while the summary described a fit check —
        # and ignoring it would spend a model budget a caller asked not to spend. Neither is a
        # reading of the contract, so the combination is refused.
        if [ "$MO_EVAL_DRY_RUN" = "true" ]; then
          echo "reuse-suite: 'dry-run' cannot apply to a suite that is already mined and validated — drop one of the two" >&2
          exit 2
        fi
        test -d "$MO_EVAL_REUSE/local-suite" || {
          echo "reuse-suite: '$MO_EVAL_REUSE' holds no local-suite/ — it is not a suite a previous run left, or it did not outlive that run" >&2
          exit 2
        }
        # LAST, after every refusal above. `GITHUB_ENV` persists for the whole job, and the summary
        # step runs `if: always()` — so writing this before a refusal would point that step at a
        # path this step just rejected, and it would report on it as though it had been used.
        echo "MO_EVAL_OUT=$MO_EVAL_REUSE" >> "$GITHUB_ENV"
        python3 "$GITHUB_ACTION_PATH/runner/main.py" submit \
          --out "$MO_EVAL_REUSE" \
          --repo-name "$MO_EVAL_REPO_NAME" \
          --service "$MO_EVAL_SERVICE" \
          --conventions-from "$GITHUB_WORKSPACE" \
          --history "$MO_EVAL_HISTORY" \
          --harnesses "${harnesses[@]}" \
          --repeats "$MO_EVAL_REPEATS" \
          --mo-version "$MO_EVAL_MO_VERSION" \
          --claude-code-version "$MO_EVAL_CLAUDE_CODE_VERSION" \
          --codex-version "$MO_EVAL_CODEX_VERSION" \
          --run "${arms[@]}"
      env:
        # Every input arrives as an environment value, not as `${{ … }}` spliced into the script —
        # see the note on the mining step's env. This step is the newer one and takes no expression
        # inside its `run:` at all.
        MO_EVAL_HARNESSES: ${{ inputs.harnesses }}
        MO_EVAL_ARMS: ${{ inputs.arms }}
        MO_EVAL_REUSE: ${{ inputs.reuse-suite }}
        MO_EVAL_REPEATS: ${{ inputs.repeats }}
        MO_EVAL_DRY_RUN: ${{ inputs.dry-run }}
        MO_EVAL_SERVICE: ${{ inputs.service }}
        MO_EVAL_HISTORY: ${{ inputs.history }}
        MO_EVAL_REPO_NAME: ${{ inputs.repo-name }}
        MO_EVAL_MO_VERSION: ${{ inputs.mo-version }}
        MO_EVAL_CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
        MO_EVAL_CODEX_VERSION: ${{ inputs.codex-version }}
        MO_EVAL_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ github.token }}   # reads review comments for the conventions judge

    - name: what crossed the boundary, and what survived
      if: always()
      shell: bash
      env:
        MO_EVAL_DRY_RUN: ${{ inputs.dry-run }}
        MO_EVAL_REUSED: ${{ inputs.reuse-suite }}
      run: |
        out="$MO_EVAL_OUT"
        echo '## mo-eval suite' >> "$GITHUB_STEP_SUMMARY"
        # A reused suite's tree still holds the wire audit and funnel of the run that MINED it, and
        # this step reads that tree. Said plainly rather than shown unlabelled: nothing crossed the
        # boundary this run, so presenting that audit as this run's would report a mining pass that
        # did not happen.
        if [ -n "$MO_EVAL_REUSED" ]; then
          echo "_reused the suite at \`$MO_EVAL_REUSED\` — nothing was mined or validated this run; the audit and funnel below are from the run that built it_" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        ls -la "$out/wire" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        # An empty suite is a result to show, not a reason for this step to fail.
        # Tolerant on purpose, and newly so: the reuse path lets a run PROCEED when a task's meta is
        # malformed — it costs the report's labels, not the run — so the step that SUMMARISES that run
        # must not be the thing that fails on it. A task whose meta cannot be read is listed by its
        # directory name rather than dropped, because it did ship.
        #
        # Written to a file here rather than passed in the environment: this step is driven by tests
        # that build their own environment, and a step needing a variable they do not know about would
        # fail for a reason unrelated to what it reports.
        summarise=$(mktemp)
        cat > "$summarise" <<'SUMMARISE'
        import json, pathlib, sys
        path = pathlib.Path(sys.argv[1])
        name = path.parent.name
        try:
            meta = json.loads(path.read_text())
        except (OSError, ValueError):
            meta = None
        if not isinstance(meta, dict):
            print(f"- `{name}` — shipped; its meta.json could not be read")
            sys.exit(0)
        generated = meta.get("generated")
        generated = generated if isinstance(generated, dict) else {}
        names = generated.get("test_names")
        tests = len(names) if isinstance(names, list) else "?"
        title = meta.get("title") if isinstance(meta.get("title"), str) else name
        print(f"- **{title}** — {tests} test(s), validated={generated.get('validated')}")
        SUMMARISE
        shopt -s nullglob
        count=0
        for meta in "$out"/tasks/*/meta.json; do
          python3 "$summarise" "$meta" >> "$GITHUB_STEP_SUMMARY"
          count=$((count + 1))
        done
        # The runner has already appended the funnel, the first failure of each kind, and what the
        # dominant reason usually means; this line only says that the task list above is empty. A
        # dry run validates nothing by design, so an empty list is not a suite that yielded nothing.
        # And a runner that stopped short — a config error, a service that refused a request —
        # reported no funnel, so neither sentence applies. Read from the runner's own record:
        # `GITHUB_STEP_SUMMARY` is a different file for every step, so what the runner appended
        # to its own is not in this one.
        if [ "$count" -eq 0 ]; then
          if [ ! -s "$out/funnel.txt" ]; then
            echo '_the runner stopped before it could report a funnel; the job log says why_' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MO_EVAL_DRY_RUN" = "true" ]; then
            echo '_dry run: nothing was validated; the funnel above is the fit check_' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '_no task survived; the funnel above says which stage emptied it_' >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mo-eval-suite
        # The task packages and the audit log of every crossing — what was mined, and what left
        # the runner. The runnable bundles go to the service directly and are not kept here.
        path: |
          ${{ env.MO_EVAL_OUT }}/tasks
          ${{ env.MO_EVAL_OUT }}/wire
          ${{ env.MO_EVAL_OUT }}/funnel.txt
        retention-days: 30
